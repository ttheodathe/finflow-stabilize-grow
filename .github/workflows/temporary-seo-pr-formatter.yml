name: Temporary SEO PR formatter

on:
  push:
    branches:
      - seo/gsc-engagement-improvements-2026-11-24

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: prettier-format SEO PR 147') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out SEO branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format only the files changed in this SEO PR
        run: |
          npx prettier --write \
            content/blog/13-week-cash-flow-forecast-template.md \
            content/blog/cash-flow-forecasting-small-business.md \
            content/blog/free-accounting-software-for-small-business.md \
            content/blog/how-to-keep-track-of-business-expenses.md \
            content/blog/profit-and-loss-statement-small-business.md \
            content/blog/small-business-accounting-software.md \
            src/routes/compare.finflow-track-vs-quickbooks.tsx \
            src/routes/compare.finflow-track-vs-wave.tsx \
            src/routes/compare.finflow-track-vs-xero.tsx \
            src/routes/compare.finflow-track-vs-zoho-books.tsx

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            content/blog/13-week-cash-flow-forecast-template.md \
            content/blog/cash-flow-forecasting-small-business.md \
            content/blog/free-accounting-software-for-small-business.md \
            content/blog/how-to-keep-track-of-business-expenses.md \
            content/blog/profit-and-loss-statement-small-business.md \
            content/blog/small-business-accounting-software.md \
            src/routes/compare.finflow-track-vs-quickbooks.tsx \
            src/routes/compare.finflow-track-vs-wave.tsx \
            src/routes/compare.finflow-track-vs-xero.tsx \
            src/routes/compare.finflow-track-vs-zoho-books.tsx
          if git diff --cached --quiet; then
            echo "The selected files are already formatted."
            exit 0
          fi
          git commit -m "style: prettier-format SEO PR 147"
          git push origin "HEAD:${GITHUB_REF_NAME}"
