name: Temporary Business Book formatter

on:
  push:
    branches:
      - feature/business-book-workspace-2026-11-26

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Business Book files
        run: npx prettier --write src/lib/business-book.test.ts src/routes/_authenticated/business-book.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/business-book.test.ts src/routes/_authenticated/business-book.tsx
          git commit -m "Format Business Book source files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
