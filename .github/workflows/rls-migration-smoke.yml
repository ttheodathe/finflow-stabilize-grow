name: RLS migration PostgreSQL smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*consolidate_overlapping_company_and_tax_return_policies.sql'
      - 'supabase/tests/rls-policy-fixture.sql'
      - 'supabase/tests/rls-policy-smoke.sql'
      - '.github/workflows/rls-migration-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*consolidate_overlapping_company_and_tax_return_policies.sql'
      - 'supabase/tests/rls-policy-fixture.sql'
      - 'supabase/tests/rls-policy-smoke.sql'
      - '.github/workflows/rls-migration-smoke.yml'

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finflow_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finflow_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build minimal Supabase-compatible fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f supabase/tests/rls-policy-fixture.sql
      - name: Apply policy consolidation migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261118043000_consolidate_overlapping_company_and_tax_return_policies.sql
      - name: Verify policy catalog and authorization behavior
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f supabase/tests/rls-policy-smoke.sql
