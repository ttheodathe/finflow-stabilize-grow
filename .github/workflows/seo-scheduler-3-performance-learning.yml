name: SEO Scheduler 3 - Performance and Learning

on:
  schedule:
    - cron: "50 14,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-scheduler-3-performance-learning
  cancel-in-progress: false

jobs:
  performance-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gate scheduled execution to 10:50 AM US Eastern (DST-aware)
        id: time-gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]] || [[ "$(TZ=America/New_York date +%H)" == "10" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring seasonal duplicate UTC cron; target is 10:50 AM America/New_York."
          fi
      - name: Install PostgreSQL client for read-only activation query
        if: steps.time-gate.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes postgresql-client
      - name: Collect independent organic performance report
        if: steps.time-gate.outputs.run == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          SEO_PRODUCTION_READONLY_DATABASE_URL: ${{ secrets.SEO_PRODUCTION_READONLY_DATABASE_URL }}
          SEO_OUTPUT_DIR: seo-output
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEO_OPS_ALLOWED_PROJECT_REF: bufbyfwstdqvwnkhyrea
          SEO_PERSISTENCE_REQUIRED: "true"
          DRY_RUN: "true"
          PUBLISH_ENABLED: "false"
          CONTENT_UPDATE_ENABLED: "false"
          PRODUCTION_CONTENT_WRITE_ALLOWED: "false"
        run: node seo-engine/schedulers/performance-learning.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.time-gate.outputs.run == 'true'
        with:
          name: seo-scheduler-3-performance-report
          path: seo-output/scheduler-3-performance-report.json
          if-no-files-found: warn
          retention-days: 30
