name: CI

on:
  pull_request:
    branches: [main, feat/stage-c-article-production-engine]
  push:
    branches:
      - main
      - feat/three-scheduler-organic-growth-ops
      - feat/stage-c-article-production-engine
      - feat/stage-c-governance-attribution
      - fix/editorial-review-public-route
      - feat/stage-c-evidence-citation-gates
      - feat/stage-d-approved-publishing-guardrails
      - feat/stage-d-publish-package-preflight
      - feat/stage-d-oidc-publisher
      - feat/stage-e-production-activation-collector

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finflow_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finflow_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test SEO pipeline and content-operation safeguards
        run: node --test seo-engine/*.test.mjs seo-engine/activation/*.test.mjs seo-engine/content-ops/*.test.mjs seo-engine/persistence/*.test.mjs seo-engine/research/*.test.mjs seo-engine/schedulers/*.test.mjs seo-engine/publishing/*.test.mjs
      - name: Syntax-check SEO publishing modules
        run: find seo-engine/publishing -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Verify fixture candidates remain blocked by exact-target intent safeguards
        run: node seo-engine/research/fixture-run.mjs

      - name: Upload B7.1 fixture drafts and evidence report
        uses: actions/upload-artifact@v4
        with:
          name: b7.1-fixture-editorial-drafts
          path: seo-output/b7.1-fixture/
          if-no-files-found: error
          retention-days: 14

      - name: Verify dependency ReDoS mitigation
        run: npm run test:security

      - name: Dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            console.log("Vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(`${item.severity}: ${name}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`);
            }
          '

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 1

      - name: Build minimal Supabase-compatible RLS fixture
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/rls-policy-fixture.sql "$container_id:/tmp/rls-policy-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/rls-policy-fixture.sql

      - name: Create isolated SEO operations acceptance database
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_seo_ops_test"

      - name: Apply SEO operations persistence migrations and synthetic activation fixture
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          for migration in \
            supabase/migrations/20261119122622_seo_operations_persistence.sql \
            supabase/migrations/20261119123210_seo_ops_rpc_ingest.sql \
            supabase/migrations/20261119123551_seo_ops_activation_snapshot_rpc.sql \
            supabase/migrations/20261119124259_seo_ops_content_operation_rpc.sql \
            supabase/migrations/20261119124347_seo_ops_content_operation_key_guard.sql \
            supabase/migrations/20261119160000_seo_ops_read_persisted_opportunities.sql \
            supabase/migrations/20261119170000_seo_ops_research_revision_persistence.sql \
            supabase/migrations/20261119154716_seo_ops_research_readback.sql \
            supabase/migrations/20261120115501_seo_ops_content_revision_immutability.sql \
            supabase/migrations/20261120193123_stage_c_editorial_approval_and_attribution.sql \
            supabase/migrations/20261121040000_stage_c_editorial_review_queue.sql \
            supabase/migrations/20261121130000_stage_c_editorial_update_proposal_queue.sql \
            supabase/migrations/20261121145000_stage_d_approved_author_metadata.sql \
            supabase/migrations/20261121151000_stage_d_article_publication_queue.sql \
            supabase/migrations/20261121152927_stage_d_review_queue_security_invoker.sql; do
            name="$(basename "$migration")"
            docker cp "$migration" "$container_id:/tmp/$name"
            docker exec "$container_id" psql -U postgres -d finflow_seo_ops_test -v ON_ERROR_STOP=1 -f "/tmp/$name"
          done
          docker cp supabase/tests/seo-activation-fixture.sql "$container_id:/tmp/seo-activation-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_seo_ops_test -v ON_ERROR_STOP=1 -f /tmp/seo-activation-fixture.sql

      - name: Verify Stage E restricted production activation view
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/seo-activation-readonly-source-fixture.sql "$container_id:/tmp/seo-activation-readonly-source-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_seo_ops_test -v ON_ERROR_STOP=1 -f /tmp/seo-activation-readonly-source-fixture.sql
          docker cp supabase/migrations/20261120190000_seo_activation_readonly_aggregate_view.sql "$container_id:/tmp/seo-activation-readonly-aggregate-view.sql"
          docker exec "$container_id" psql -U postgres -d finflow_seo_ops_test -v ON_ERROR_STOP=1 -f /tmp/seo-activation-readonly-aggregate-view.sql
          docker cp supabase/tests/seo-activation-readonly-view-smoke.sql "$container_id:/tmp/seo-activation-readonly-view-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_seo_ops_test -v ON_ERROR_STOP=1 -f /tmp/seo-activation-readonly-view-smoke.sql
          docker cp supabase/migrations/20261121181000_stage_e_oidc_activation_reader.sql "$container_id:/tmp/stage-e-oidc-activation-reader.sql"
          docker exec "$container_id" psql -U postgres -d finflow_seo_ops_test -v ON_ERROR_STOP=1 -f /tmp/stage-e-oidc-activation-reader.sql
          docker cp supabase/tests/seo-activation-oidc-reader-smoke.sql "$container_id:/tmp/seo-activation-oidc-reader-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_seo_ops_test -v ON_ERROR_STOP=1 -f /tmp/seo-activation-oidc-reader-smoke.sql

      - name: Verify SEO operations persistence, RLS and activation aggregation
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/seo-ops-persistence-smoke.sql "$container_id:/tmp/seo-ops-persistence-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_seo_ops_test -v ON_ERROR_STOP=1 -f /tmp/seo-ops-persistence-smoke.sql

      - name: Verify editorial queue exposes constructive duplicate-update recommendations
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/editorial-update-proposal-queue-smoke.sql "$container_id:/tmp/editorial-update-proposal-queue-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_seo_ops_test -v ON_ERROR_STOP=1 -f /tmp/editorial-update-proposal-queue-smoke.sql

      - name: Apply payroll entitlement migration
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/migrations/20261118011000_stage_a7_complete_payroll_write_entitlement.sql "$container_id:/tmp/payroll-entitlement-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/payroll-entitlement-migration.sql

      - name: Verify payroll entitlement enforcement
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/payroll-entitlement-smoke.sql "$container_id:/tmp/payroll-entitlement-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/payroll-entitlement-smoke.sql

      - name: Apply RLS policy consolidation migration
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/migrations/20261118043000_consolidate_overlapping_company_and_tax_return_policies.sql "$container_id:/tmp/rls-policy-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/rls-policy-migration.sql

      - name: Apply payroll write-integrity migration to RLS fixture
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/migrations/20261118090000_stage_a7_lock_payroll_writes_and_state_transitions.sql "$container_id:/tmp/payroll-write-integrity.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/payroll-write-integrity.sql

      - name: Verify RLS policy catalog and authorization boundaries
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/rls-policy-smoke.sql "$container_id:/tmp/rls-policy-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/rls-policy-smoke.sql

      - name: Create isolated atomic payroll database
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_payroll_atomic_test"

      - name: Build atomic payroll fixture and apply RPC migration
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/payroll-atomic-fixture.sql "$container_id:/tmp/payroll-atomic-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_payroll_atomic_test -v ON_ERROR_STOP=1 -f /tmp/payroll-atomic-fixture.sql
          docker cp supabase/migrations/20261117224524_stage_a7_atomic_payroll_generation.sql "$container_id:/tmp/atomic-payroll-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_payroll_atomic_test -v ON_ERROR_STOP=1 -f /tmp/atomic-payroll-migration.sql

      - name: Apply payroll write-integrity migration to atomic fixture
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/migrations/20261118090000_stage_a7_lock_payroll_writes_and_state_transitions.sql "$container_id:/tmp/payroll-write-integrity.sql"
          docker exec "$container_id" psql -U postgres -d finflow_payroll_atomic_test -v ON_ERROR_STOP=1 -f /tmp/payroll-write-integrity.sql

      - name: Verify atomic payroll generation and financial integrity
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/payroll-atomic-smoke.sql "$container_id:/tmp/payroll-atomic-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_payroll_atomic_test -v ON_ERROR_STOP=1 -f /tmp/payroll-atomic-smoke.sql

      - name: Create isolated partner approval database
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_partner_approval_test"

      - name: Verify partner approval state and commission guards
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/partner-approval-fixture.sql "$container_id:/tmp/partner-approval-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_approval_test -v ON_ERROR_STOP=1 -f /tmp/partner-approval-fixture.sql
          docker cp supabase/migrations/20261118110000_stage_a8_guard_partner_application_approval.sql "$container_id:/tmp/partner-approval-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_approval_test -v ON_ERROR_STOP=1 -f /tmp/partner-approval-migration.sql
          docker cp supabase/tests/partner-approval-smoke.sql "$container_id:/tmp/partner-approval-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_approval_test -v ON_ERROR_STOP=1 -f /tmp/partner-approval-smoke.sql

      - name: Verify pending partner application deduplication
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_partner_dedup_test"
          docker cp supabase/tests/partner-submission-dedup-fixture.sql "$container_id:/tmp/partner-submission-dedup-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_dedup_test -v ON_ERROR_STOP=1 -f /tmp/partner-submission-dedup-fixture.sql
          docker cp supabase/migrations/20261118130000_partner_application_pending_email_uniqueness.sql "$container_id:/tmp/partner-submission-dedup-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_dedup_test -v ON_ERROR_STOP=1 -f /tmp/partner-submission-dedup-migration.sql
          docker cp supabase/tests/partner-submission-dedup-smoke.sql "$container_id:/tmp/partner-submission-dedup-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_dedup_test -v ON_ERROR_STOP=1 -f /tmp/partner-submission-dedup-smoke.sql

      - name: Verify anonymous public-table access allowlist
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_anon_acl_test"
          docker cp supabase/tests/anon-table-access-fixture.sql "$container_id:/tmp/anon-table-access-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_anon_acl_test -v ON_ERROR_STOP=1 -f /tmp/anon-table-access-fixture.sql
          docker cp supabase/migrations/20261118140000_revoke_anonymous_public_table_access.sql "$container_id:/tmp/anon-table-access-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_anon_acl_test -v ON_ERROR_STOP=1 -f /tmp/anon-table-access-migration.sql
          docker cp supabase/tests/anon-table-access-smoke.sql "$container_id:/tmp/anon-table-access-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_anon_acl_test -v ON_ERROR_STOP=1 -f /tmp/anon-table-access-smoke.sql

      - name: Verify partner application email validation
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_partner_email_test"
          docker cp supabase/tests/partner-email-validation-fixture.sql "$container_id:/tmp/partner-email-validation-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_email_test -v ON_ERROR_STOP=1 -f /tmp/partner-email-validation-fixture.sql
          docker cp supabase/migrations/20261118150000_fix_partner_application_email_validation.sql "$container_id:/tmp/partner-email-validation-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_email_test -v ON_ERROR_STOP=1 -f /tmp/partner-email-validation-migration.sql
          docker cp supabase/migrations/20261118025042_partner_application_server_rate_limit.sql "$container_id:/tmp/partner-rate-limit-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_email_test -v ON_ERROR_STOP=1 -f /tmp/partner-rate-limit-migration.sql
          docker cp supabase/tests/partner-email-validation-smoke.sql "$container_id:/tmp/partner-email-validation-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_email_test -v ON_ERROR_STOP=1 -f /tmp/partner-email-validation-smoke.sql
          docker cp supabase/rollout/post-deploy/revoke_legacy_partner_application_rpc.sql "$container_id:/tmp/partner-rpc-revocation-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_email_test -v ON_ERROR_STOP=1 -f /tmp/partner-rpc-revocation-migration.sql
          docker cp supabase/tests/partner-application-rpc-revocation-smoke.sql "$container_id:/tmp/partner-application-rpc-revocation-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_email_test -v ON_ERROR_STOP=1 -f /tmp/partner-application-rpc-revocation-smoke.sql

      - name: Verify invoice share link expiry and revocation
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_invoice_share_test"
          docker cp supabase/tests/invoice-share-link-fixture.sql "$container_id:/tmp/invoice-share-link-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_invoice_share_test -v ON_ERROR_STOP=1 -f /tmp/invoice-share-link-fixture.sql
          docker cp supabase/migrations/20261118025047_invoice_share_link_lifecycle.sql "$container_id:/tmp/invoice-share-link-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_invoice_share_test -v ON_ERROR_STOP=1 -f /tmp/invoice-share-link-migration.sql
          docker cp supabase/tests/invoice-share-link-prepare-smoke.sql "$container_id:/tmp/invoice-share-link-prepare-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_invoice_share_test -v ON_ERROR_STOP=1 -f /tmp/invoice-share-link-prepare-smoke.sql
          docker cp supabase/rollout/post-deploy/set_invoice_share_link_default_expiry.sql "$container_id:/tmp/invoice-share-link-default-expiry.sql"
          docker exec "$container_id" psql -U postgres -d finflow_invoice_share_test -v ON_ERROR_STOP=1 -f /tmp/invoice-share-link-default-expiry.sql
          docker cp supabase/tests/invoice-share-link-smoke.sql "$container_id:/tmp/invoice-share-link-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_invoice_share_test -v ON_ERROR_STOP=1 -f /tmp/invoice-share-link-smoke.sql

      - name: Verify manual journal role authorization
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_journal_role_test"
          docker cp supabase/tests/manual-journal-role-fixture.sql "$container_id:/tmp/manual-journal-role-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_journal_role_test -v ON_ERROR_STOP=1 -f /tmp/manual-journal-role-fixture.sql
          docker cp supabase/migrations/20261118160000_restrict_manual_journal_write_roles.sql "$container_id:/tmp/manual-journal-role-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_journal_role_test -v ON_ERROR_STOP=1 -f /tmp/manual-journal-role-migration.sql
          docker cp supabase/tests/manual-journal-role-smoke.sql "$container_id:/tmp/manual-journal-role-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_journal_role_test -v ON_ERROR_STOP=1 -f /tmp/manual-journal-role-smoke.sql

      - name: Verify demo request migration, RLS, consent and rate limits
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_demo_request_test"
          docker cp supabase/tests/demo-request-fixture.sql "$container_id:/tmp/demo-request-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_demo_request_test -v ON_ERROR_STOP=1 -f /tmp/demo-request-fixture.sql
          docker cp supabase/migrations/20261125170000_create_demo_requests.sql "$container_id:/tmp/demo-request-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_demo_request_test -v ON_ERROR_STOP=1 -f /tmp/demo-request-migration.sql
          docker cp supabase/tests/demo-request-smoke.sql "$container_id:/tmp/demo-request-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_demo_request_test -v ON_ERROR_STOP=1 -f /tmp/demo-request-smoke.sql

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Preview API formatting changes
        run: |
          for file in src/routes/api/send-invoice.tsx src/routes/api/send-reminder.tsx; do
            echo "### $file"
            npx prettier "$file" | diff -u "$file" - || true
          done

      - name: Check formatting of changed files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' | xargs -0 -r npx prettier --check

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          POLAR_ACCESS_TOKEN: ci-placeholder
          POLAR_SERVER: sandbox
          RESEND_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Enforce high-severity dependency audit
        run: node scripts/check-npm-audit.mjs

  # PR 120 acceptance writes require the explicit acceptance-write-authorized label.
  genuine-acceptance:
    name: Genuine GSC-to-draft and Scheduler 3 persistence acceptance
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 120 && contains(github.event.pull_request.labels.*.name, 'acceptance-write-authorized') && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      DRY_RUN: "true"
      PUBLISH_ENABLED: "false"
      CONTENT_UPDATE_ENABLED: "false"
      PRODUCTION_CONTENT_WRITE_ALLOWED: "false"
      SEO_OPS_ALLOWED_PROJECT_REF: "bufbyfwstdqvwnkhyrea"
      SEO_PERSISTENCE_REQUIRED: "true"
      SEO_ACCEPTANCE_WRITE_AUTHORIZED: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download original historical GSC artifact
        uses: actions/download-artifact@v4
        with:
          name: finflow-seo-readonly-data
          path: historical-gsc
          repository: ${{ github.repository }}
          run-id: 44448533423
          github-token: ${{ github.token }}
      - name: Run genuine GSC to editorial draft acceptance
        run: node seo-engine/research/acceptance-run.mjs historical-gsc/seo-data-2026-10-19-to-2026-11-15.json
      - name: Run Scheduler 3 live metrics and acceptance persistence check
        run: node seo-engine/schedulers/performance-learning.mjs
      - name: Upload genuine acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-recovery-genuine-acceptance-${{ github.sha }}
          path: |
            seo-output/acceptance/
            seo-output/scheduler-3-performance-report.json
          if-no-files-found: warn
          retention-days: 14

  daily-portfolio-acceptance:
    name: Live GSC daily portfolio and Scheduler 3 acceptance
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 121 && contains(github.event.pull_request.labels.*.name, 'acceptance-write-authorized') && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      DRY_RUN: "true"
      PUBLISH_ENABLED: "false"
      CONTENT_UPDATE_ENABLED: "false"
      PRODUCTION_CONTENT_WRITE_ALLOWED: "false"
      SEO_OPS_ALLOWED_PROJECT_REF: "bufbyfwstdqvwnkhyrea"
      SEO_PERSISTENCE_REQUIRED: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      SEO_OUTPUT_DIR: seo-output
      SEO_RESEARCH_OUTPUT_DIR: content/operations/research
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Scheduler 1 with live GSC evidence against acceptance persistence
        run: node seo-engine/schedulers/search-intelligence.mjs
      - name: Run Scheduler 2 daily new/update portfolio against persisted opportunities
        run: node seo-engine/schedulers/content-operations.mjs seo-output/scheduler-1-opportunities.json
      - name: Run Scheduler 3 performance and learning against acceptance persistence
        run: node seo-engine/schedulers/performance-learning.mjs
      - name: Summarize daily portfolio acceptance evidence
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("seo-output/scheduler-2-content-queue.json", "utf8"));
            console.log(JSON.stringify({
              selectedCandidateCount: report.selectedCandidateCount,
              readyDraftCount: report.readyDraftCount,
              rejectedCount: report.rejectedCount,
              dailyPortfolio: report.dailyPortfolio,
              productionMutation: report.productionMutation,
              persistence: report.persistence
            }, null, 2));
            if (report.productionMutation !== "BLOCKED" || report.persistence?.status !== "PERSISTED") process.exit(1);
          '
      - name: Upload live daily portfolio acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-daily-portfolio-acceptance-${{ github.sha }}
          path: |
            seo-output/
            content/operations/research/research-pipeline-report.json
            content/operations/research/drafts/*.md
          if-no-files-found: warn
          retention-days: 14
