name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh candidate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload candidate lockfile
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            console.log("Vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(`${item.severity}: ${name}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`);
            }
          '

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 1

      - name: Lint
        run: npm run lint

      - name: Format changed files in CI
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' > /tmp/changed-files
          xargs -0 -r npx prettier --write < /tmp/changed-files

      - name: Format changed files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' | xargs -0 -r npx prettier --check

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          POLAR_ACCESS_TOKEN: ci-placeholder
          POLAR_SERVER: sandbox
          RESEND_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          LOVABLE_REACHABILITY_MANIFEST: "1"

      - name: Upload bundle reachability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-reachability
          path: node_modules/.lovable/reachability.json
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce high-severity dependency audit
        run: npm audit
