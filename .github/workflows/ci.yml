name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finflow_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finflow_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency ReDoS mitigation
        run: npm run test:security

      - name: Dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            console.log("Vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(`${item.severity}: ${name}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`);
            }
          '

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 1

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Build minimal Supabase-compatible RLS fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f supabase/tests/rls-policy-fixture.sql

      - name: Apply RLS policy consolidation migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261118043000_consolidate_overlapping_company_and_tax_return_policies.sql

      - name: Verify RLS policy catalog and authorization boundaries
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f supabase/tests/rls-policy-smoke.sql

      - name: Lint
        run: npm run lint

      - name: Format changed files in CI
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' > /tmp/changed-files
          xargs -0 -r npx prettier --write < /tmp/changed-files

      - name: Format changed files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' | xargs -0 -r npx prettier --check

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          POLAR_ACCESS_TOKEN: ci-placeholder
          POLAR_SERVER: sandbox
          RESEND_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder

      - name: Enforce high-severity dependency audit
        run: node scripts/check-npm-audit.mjs
