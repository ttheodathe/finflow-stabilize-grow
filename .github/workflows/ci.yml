name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finflow_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finflow_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency ReDoS mitigation
        run: npm run test:security

      - name: Dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            console.log("Vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(`${item.severity}: ${name}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`);
            }
          '

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 1

      - name: Build minimal Supabase-compatible RLS fixture
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/rls-policy-fixture.sql "$container_id:/tmp/rls-policy-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/rls-policy-fixture.sql

      - name: Apply payroll entitlement migration
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/migrations/20261118011000_stage_a7_complete_payroll_write_entitlement.sql "$container_id:/tmp/payroll-entitlement-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/payroll-entitlement-migration.sql

      - name: Verify payroll entitlement enforcement
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/payroll-entitlement-smoke.sql "$container_id:/tmp/payroll-entitlement-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/payroll-entitlement-smoke.sql

      - name: Apply RLS policy consolidation migration
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/migrations/20261118043000_consolidate_overlapping_company_and_tax_return_policies.sql "$container_id:/tmp/rls-policy-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/rls-policy-migration.sql

      - name: Apply payroll write-integrity migration to RLS fixture
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/migrations/20261118090000_stage_a7_lock_payroll_writes_and_state_transitions.sql "$container_id:/tmp/payroll-write-integrity.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/payroll-write-integrity.sql

      - name: Verify RLS policy catalog and authorization boundaries
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/rls-policy-smoke.sql "$container_id:/tmp/rls-policy-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_rls_test -v ON_ERROR_STOP=1 -f /tmp/rls-policy-smoke.sql

      - name: Create isolated atomic payroll database
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_payroll_atomic_test"

      - name: Build atomic payroll fixture and apply RPC migration
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/payroll-atomic-fixture.sql "$container_id:/tmp/payroll-atomic-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_payroll_atomic_test -v ON_ERROR_STOP=1 -f /tmp/payroll-atomic-fixture.sql
          docker cp supabase/migrations/20261117224524_stage_a7_atomic_payroll_generation.sql "$container_id:/tmp/atomic-payroll-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_payroll_atomic_test -v ON_ERROR_STOP=1 -f /tmp/atomic-payroll-migration.sql

      - name: Apply payroll write-integrity migration to atomic fixture
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/migrations/20261118090000_stage_a7_lock_payroll_writes_and_state_transitions.sql "$container_id:/tmp/payroll-write-integrity.sql"
          docker exec "$container_id" psql -U postgres -d finflow_payroll_atomic_test -v ON_ERROR_STOP=1 -f /tmp/payroll-write-integrity.sql

      - name: Verify atomic payroll generation and financial integrity
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/payroll-atomic-smoke.sql "$container_id:/tmp/payroll-atomic-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_payroll_atomic_test -v ON_ERROR_STOP=1 -f /tmp/payroll-atomic-smoke.sql

      - name: Create isolated partner approval database
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_partner_approval_test"

      - name: Verify partner approval state and commission guards
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp supabase/tests/partner-approval-fixture.sql "$container_id:/tmp/partner-approval-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_approval_test -v ON_ERROR_STOP=1 -f /tmp/partner-approval-fixture.sql
          docker cp supabase/migrations/20261118110000_stage_a8_guard_partner_application_approval.sql "$container_id:/tmp/partner-approval-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_approval_test -v ON_ERROR_STOP=1 -f /tmp/partner-approval-migration.sql
          docker cp supabase/tests/partner-approval-smoke.sql "$container_id:/tmp/partner-approval-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_approval_test -v ON_ERROR_STOP=1 -f /tmp/partner-approval-smoke.sql

      - name: Verify pending partner application deduplication
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finflow_partner_dedup_test"
          docker cp supabase/tests/partner-submission-dedup-fixture.sql "$container_id:/tmp/partner-submission-dedup-fixture.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_dedup_test -v ON_ERROR_STOP=1 -f /tmp/partner-submission-dedup-fixture.sql
          docker cp supabase/migrations/20261118130000_partner_application_pending_email_uniqueness.sql "$container_id:/tmp/partner-submission-dedup-migration.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_dedup_test -v ON_ERROR_STOP=1 -f /tmp/partner-submission-dedup-migration.sql
          docker cp supabase/tests/partner-submission-dedup-smoke.sql "$container_id:/tmp/partner-submission-dedup-smoke.sql"
          docker exec "$container_id" psql -U postgres -d finflow_partner_dedup_test -v ON_ERROR_STOP=1 -f /tmp/partner-submission-dedup-smoke.sql

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Check formatting of changed files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' | xargs -0 -r npx prettier --check

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          POLAR_ACCESS_TOKEN: ci-placeholder
          POLAR_SERVER: sandbox
          RESEND_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Enforce high-severity dependency audit
        run: node scripts/check-npm-audit.mjs
