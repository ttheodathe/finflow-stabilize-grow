name: Temporary PR 143 Prettier Repair
on:
  push:
    branches:
      - seo/fix-blog-headings-and-pricing-meta-2026-11-23
    paths:
      - .github/workflows/pr143-format-repair.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format the failed file with the repository's Prettier version
        run: npx --yes prettier@3.7.3 --write src/routes/compare.index.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet -- src/routes/compare.index.tsx; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/compare.index.tsx
          git commit -m "fix: format compare route for CI"
          git push origin HEAD:${{ github.ref_name }}
