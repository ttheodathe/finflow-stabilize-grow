name: SEO Scheduler 1 - Search Intelligence

on:
  schedule:
    - cron: "5 13,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-scheduler-1-search-intelligence
  cancel-in-progress: false

jobs:
  search-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gate scheduled execution to 9:05 AM US Eastern (DST-aware)
        id: time-gate
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]] || [[ "$(TZ=America/New_York date +%H)" == "09" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring seasonal duplicate UTC cron; target is 9:05 AM America/New_York."
          fi
      - name: Collect and rank search opportunities
        if: steps.time-gate.outputs.run == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          SEO_OUTPUT_DIR: seo-output
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEO_OPS_ALLOWED_PROJECT_REF: bufbyfwstdqvwnkhyrea
          SEO_PERSISTENCE_REQUIRED: "true"
          DRY_RUN: "true"
          PUBLISH_ENABLED: "false"
          CONTENT_UPDATE_ENABLED: "false"
          PRODUCTION_CONTENT_WRITE_ALLOWED: "false"
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          node seo-engine/schedulers/search-intelligence.mjs
      - uses: actions/upload-artifact@v4
        if: steps.time-gate.outputs.run == 'true'
        with:
          name: seo-scheduler-1-opportunities
          path: seo-output/
          if-no-files-found: error
          retention-days: 30
